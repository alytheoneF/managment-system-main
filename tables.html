<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaza Cafe - Tables</title>
  <link rel="stylesheet" href="tables.css" />
</head>
<body>
  <div class="container">
    <header class="logo">
      <span class="zaza">Zaza</span>
      <span class="cafe">Cafe</span>
    </header>

    <h2 class="menu-title">Table Availability</h2>
    <div class="menu-grid">
      <div class="menu-item">
        <img src="images/table1.png" alt="Table 1" class="menu-image" />
        <p class="item-name">Table 1</p>
        <div class="status in-stock">Open</div>
      </div>

      <div class="menu-item">
        <img src="images/table2.png" alt="Table 2" class="menu-image" />
        <p class="item-name">Table 2</p>
        <div class="status out-of-stock">Reserved</div>
      </div>

      <div class="menu-item">
        <img src="images/table3.png" alt="Table 3" class="menu-image" />
        <p class="item-name">Table 3</p>
        <div class="status in-stock">Open</div>
      </div>

      <div class="menu-item">
        <img src="images/table4.png" alt="Table 4" class="menu-image" />
        <p class="item-name">Table 4</p>
        <div class="status in-stock">Open</div>
      </div>

      <div class="menu-item">
        <img src="images/table5.png" alt="Table 5" class="menu-image" />
        <p class="item-name">Table 5</p>
        <div class="status out-of-stock">Reserved</div>
      </div>

      <div class="menu-item">
        <img src="images/table6.png" alt="Table 6" class="menu-image" />
        <p class="item-name">Table 6</p>
        <div class="status in-stock">Open</div>
      </div>

      <div class="menu-item">
        <img src="images/table7.png" alt="Table 7" class="menu-image" />
        <p class="item-name">Table 7</p>
        <div class="status in-stock">Open</div>
      </div>

      <div class="menu-item">
        <img src="images/table8.png" alt="Table 8" class="menu-image" />
        <p class="item-name">Table 8</p>
        <div class="status in-stock">Open</div>
      </div>

      <div class="menu-item">
        <img src="images/table9.png" alt="Table 9" class="menu-image" />
        <p class="item-name">Table 9</p>
        <div class="status out-of-stock">Reserved</div>
      </div>
    </div>
  </div>
</body>
</html>
