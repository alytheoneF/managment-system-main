<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaza Cafe - Analytics</title>
  <link rel="stylesheet" href="analytics.css" />
</head>
<body>
  <div class="container">
    <header class="top-bar">
      <div class="logo">
        <span class="zaza">Zaza</span>
        <span class="cafe">Cafe</span>
      </div>
      <button class="logout-btn">Logout</button>
    </header>

    <h2 class="section-title">Dashboard</h2>
    <div class="dashboard">
      <div class="card revenue">
        <h3>Revenue</h3>
        <p>$12,450</p>
      </div>
      <div class="card expenses">
        <h3>Expenses</h3>
        <p>$4,210</p>
      </div>
      <div class="card profit">
        <h3>Net Profit</h3>
        <p>$8,240</p>
      </div>
    </div>

    <h2 class="section-title">Top Sellers</h2>
    <div class="items-grid">
      <!-- Example item block -->
      <div class="item-box">
        <img src="images/item1.png" alt="Top Item 1" class="item-image" />
        <p class="item-name">Molto</p>
        <p class="status in-stock">Sold: 150</p>
      </div>

      <div class="item-box">
        <img src="images/item2.png" alt="Top Item 2" class="item-image" />
        <p class="item-name">Shigo</p>
        <p class="status in-stock">Sold: 120</p>
      </div>

      <!-- Add more top sellers below -->
    </div>
  </div>
</body>
</html>
