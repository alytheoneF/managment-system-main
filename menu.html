<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu - Zaza Cafe</title>
  <link rel="stylesheet" href="menu.css" />
</head>
<body>
  <div class="container">
    <header class="logo">
      <span class="zaza">Zaza</span>
      <span class="cafe">Cafe</span>
    </header>
    <h2 class="menu-title">Menu Availability</h2>
    <div class="menu-grid">
      <div class="menu-item">
        <img src="images/juhaga.jpg" alt="Juhaga Mix" class="menu-image" />
        <p class="item-name">Juhaga Mix</p>
        <div class="status in-stock">In Stock</div>
      </div>
      <div class="menu-item">
        <img src="images/molto.jpg" alt="Molten Cake" class="menu-image" />
        <p class="item-name">Molten Cake</p>
        <div class="status in-stock">In Stock</div>
      </div>
      <div class="menu-item">
        <img src="images/redbull.jpg" alt="Red Bull" class="menu-image" />
        <p class="item-name">Red Bull</p>
        <div class="status out-of-stock">Out of Stock</div>
      </div>
      <div class="menu-item">
        <img src="images/shisho.jpg" alt="Shisho To-go" class="menu-image" />
        <p class="item-name">Shisho To-Go</p>
        <div class="status out-of-stock">Out of Stock</div>
      </div>
    </div>
  </div>
</body>
</html>
